<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CafeMaster Console</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--line:#2b3440;--text:#e6edf3;--muted:#8b98a8;
  --accent:#4f8cff;--green:#2ea043;--amber:#d29922;--red:#e5534b;--grey:#59636e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:7px 12px;border-radius:6px;color:var(--muted);cursor:pointer}
nav button.on{background:var(--panel2);color:var(--text)}
.kpis{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}
.kpi{font-size:12px;color:var(--muted)} .kpi b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar .sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red)} .btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;position:relative;border-top:3px solid var(--grey)}
.pc.idle{border-top-color:var(--green)} .pc.in_use{border-top-color:var(--accent)}
.pc.warn{border-top-color:var(--amber)} .pc.offline{opacity:.6} .pc.in_use_offline{border-top-color:var(--red)}
.pc.sel{outline:2px solid var(--accent)}
.pc-h{display:flex;align-items:center;gap:8px}
.pc-h input{accent-color:var(--accent)}
.pc-name{font-weight:650;font-size:15px}
.tag{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.st{margin-left:auto;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.timer{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.sub{color:var(--muted);font-size:12px;min-height:18px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2)}
tr:last-child td{border-bottom:0}
input[type=text],input[type=password],input[type=number],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card small{color:var(--muted)} .card b{display:block;font-size:20px;margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px}
.row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.row label{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:16px;cursor:pointer;background:var(--panel2)}
.chip.on{border-color:var(--accent);background:rgba(79,140,255,.15)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:8px;display:none;z-index:30}
#toast.err{border-color:var(--red)}
#login{max-width:340px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:12px}
.hide{display:none!important}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
code{background:var(--panel2);padding:2px 6px;border-radius:4px;word-break:break-all}
@media (max-width:640px){header{padding:10px 16px}main{padding:14px 16px}.kpis{margin-left:0;width:100%}}
</style>
</head>
<body>

<div id="login">
  <h2 style="margin-top:0">CafeMaster</h2>
  <p class="muted">Staff login</p>
  <form id="loginForm">
    <div class="row"><label>Admin password</label><input type="password" id="pw" autofocus></div>
    <button class="btn pri" style="width:100%">Log in</button>
  </form>
</div>

<div id="app" class="hide">
<header>
  <h1 id="cafeName">CafeMaster</h1>
  <nav>
    <button data-tab="pcs" class="on">PCs</button>
    <button data-tab="members">Members</button>
    <button data-tab="reports">Reports</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="kpis">
    <div class="kpi">In use<b id="kInUse">0</b></div>
    <div class="kpi">Free<b id="kFree">0</b></div>
    <div class="kpi">Offline<b id="kOff">0</b></div>
    <div class="kpi">Cash today<b id="kCash">0</b></div>
  </div>
</header>

<main>
  <!-- PCs -->
  <section id="tab-pcs">
    <div class="bar">
      <label class="chip"><input type="checkbox" id="selAll"> Select all</label>
      <span class="muted" id="selCount"></span>
      <span class="sp"></span>
      <button class="btn" data-bulk="message">Message</button>
      <button class="btn" data-bulk="lock">Lock</button>
      <button class="btn danger" data-bulk="restart">Restart</button>
      <button class="btn danger" data-bulk="shutdown">Shut down</button>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <!-- Members -->
  <section id="tab-members" class="hide">
    <div class="bar">
      <input type="text" id="mSearch" placeholder="Search name, username, phone">
      <span class="sp"></span>
      <button class="btn pri" id="mAdd">+ New member</button>
    </div>
    <table><thead><tr><th>Username</th><th>Name</th><th>Phone</th><th>Balance</th><th>Status</th><th></th></tr></thead>
    <tbody id="mBody"></tbody></table>
  </section>

  <!-- Reports -->
  <section id="tab-reports" class="hide">
    <div class="bar">
      <input type="date" id="rDate">
      <button class="btn" id="rLoad">Load</button>
      <span class="sp"></span>
      <button class="btn" id="rCsv">Download CSV (Excel)</button>
    </div>
    <div class="cards" id="rCards"></div>
    <h3>Sessions</h3>
    <table><thead><tr><th>Start</th><th>End</th><th>PC</th><th>User</th><th>Type</th><th>Minutes</th><th>Amount</th><th>Ended by</th></tr></thead>
    <tbody id="rBody"></tbody></table>
  </section>

  <!-- Settings -->
  <section id="tab-settings" class="hide">
    <div class="card" style="max-width:560px">
      <div class="row"><label>Cafe name</label><input type="text" id="sName"></div>
      <div class="row"><label>Currency symbol</label><input type="text" id="sCur" style="width:80px"></div>
      <div class="row"><label>Rates per hour (group = rate)</label><div id="sRates"></div>
        <button class="btn sm" id="sAddRate" type="button" style="align-self:flex-start">+ Add group</button></div>
      <div class="row"><label>Minimum billable minutes (pay-later and member sessions)</label><input type="number" id="sMin" min="0"></div>
      <div class="row"><label>Bill in blocks of N minutes</label><input type="number" id="sRound" min="1"></div>
      <div class="row"><label>New admin password (leave blank to keep)</label><input type="password" id="sPw"></div>
      <div class="row"><label>Agent key (paste into each gaming PC's agent config)</label><code id="sKey"></code></div>
      <div class="foot"><button class="btn pri" id="sSave">Save settings</button></div>
    </div>
  </section>
</main>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let token = sessionStorageGet('cm_token');
let state = null, selected = new Set(), clockOffset = 0;

function sessionStorageGet(k){ try { return sessionStorage.getItem(k) } catch { return null } }
function sessionStorageSet(k,v){ try { v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v) } catch {} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur = () => state?.settings?.currency ?? '₹';
const money = n => cur() + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2});
const fmtDur = sec => { sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` };
const fmtTime = ts => ts ? new Date(ts*1000).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '';

function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', 3500) }

async function api(path, opts={}){
  const r = await fetch('/api'+path, {method: opts.method || (opts.body?'POST':'GET'),
    headers: {'Content-Type':'application/json', 'X-Admin-Token': token||''},
    body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (r.status === 401 && path !== '/login') { logout(); throw new Error('Session expired, log in again') }
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
async function act(fn, okMsg){ try { const r = await fn(); if (okMsg) toast(okMsg); await refresh(); return r } catch(e){ toast(e.message, true) } }

// ---------- auth ----------
$('#loginForm').onsubmit = async e => { e.preventDefault();
  try { token = (await api('/login',{body:{password:$('#pw').value}})).token; sessionStorageSet('cm_token', token); boot() }
  catch(e){ toast(e.message, true) } };
function logout(){ token=null; sessionStorageSet('cm_token', null); $('#app').classList.add('hide'); $('#login').classList.remove('hide') }
function boot(){ $('#login').classList.add('hide'); $('#app').classList.remove('hide'); refresh(); }

// ---------- tabs ----------
$$('nav button').forEach(b => b.onclick = () => {
  $$('nav button').forEach(x=>x.classList.toggle('on', x===b));
  $$('main > section').forEach(s => s.classList.toggle('hide', s.id !== 'tab-'+b.dataset.tab));
  if (b.dataset.tab==='members') loadMembers();
  if (b.dataset.tab==='reports') loadReport();
  if (b.dataset.tab==='settings') loadSettings();
});

// ---------- PCs ----------
async function refresh(){
  if (!token) return;
  try { state = await api('/state'); clockOffset = state.server_time - Date.now()/1000; render() }
  catch(e){ if (token) console.warn(e) }
}
function render(){
  $('#cafeName').textContent = state.settings.cafe_name;
  const pcs = state.pcs;
  $('#kInUse').textContent = pcs.filter(p=>p.session).length;
  $('#kFree').textContent = pcs.filter(p=>p.status==='idle').length;
  $('#kOff').textContent = pcs.filter(p=>!p.online).length;
  $('#kCash').textContent = money(state.today.cash_collected);
  for (const id of [...selected]) if (!pcs.find(p=>p.id===id)) selected.delete(id);
  $('#selCount').textContent = selected.size ? `${selected.size} selected` : '';
  $('#selAll').checked = pcs.length && selected.size === pcs.length;
  if (!pcs.length){ $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">No PCs yet. Run <code>client/agent.py</code> on each gaming PC — they appear here automatically.</div>`; return }
  $('#grid').innerHTML = pcs.map(pcCard).join('');
}
function pcCard(p){
  const s = p.session, nowS = Date.now()/1000 + clockOffset;
  let timer='—', sub='', cls=p.status;
  const labels = {idle:'Free', in_use:'In use', offline:'Offline', in_use_offline:'In use · no signal'};
  if (s){
    if (s.ends){ const rem = s.ends - nowS; timer = fmtDur(rem); if (rem < 300) cls += ' warn' }
    else timer = fmtDur(nowS - s.started);
    const modeTxt = {prepaid:'Prepaid', postpaid:'Pay later', member:'Member', free:'Free'}[s.mode];
    sub = `${esc(s.user)} · ${modeTxt} · ${s.ends ? 'left' : 'elapsed'} · ${money(s.cost)}`;
  } else sub = p.online ? `${money(p.rate)}/hr · ${esc(p.ip)}` : (p.last_seen ? 'Last seen '+fmtTime(p.last_seen) : 'Never connected');
  const a = [];
  if (s){
    if (s.mode==='prepaid') a.push(`<button class="btn sm" onclick="addTimeModal('${p.id}')">+ Time</button>`);
    a.push(`<button class="btn sm ok" onclick="endSession('${p.id}')">End & bill</button>`);
  } else a.push(`<button class="btn sm pri" onclick="startModal('${p.id}')">Start</button>`);
  a.push(`<button class="btn sm" onclick="msgModal(['${p.id}'])">Msg</button>`);
  a.push(`<button class="btn sm" onclick="pcModal('${p.id}')">⋯</button>`);
  return `<div class="pc ${cls} ${selected.has(p.id)?'sel':''}">
    <div class="pc-h"><input type="checkbox" ${selected.has(p.id)?'checked':''} onchange="toggleSel('${p.id}',this.checked)">
      <span class="pc-name">${esc(p.name)}</span><span class="tag">${esc(p.group)}</span>
      <span class="st">${labels[p.status]}</span></div>
    <div class="timer">${timer}</div><div class="sub">${sub}</div>
    <div class="acts">${a.join('')}</div></div>`;
}
function toggleSel(id,on){ on?selected.add(id):selected.delete(id); render() }
$('#selAll').onchange = e => { selected = new Set(e.target.checked ? state.pcs.map(p=>p.id) : []); render() };
$$('[data-bulk]').forEach(b => b.onclick = () => {
  const ids = selected.size ? [...selected] : null, type = b.dataset.bulk;
  const scope = ids ? `${ids.length} selected PC(s)` : 'ALL online PCs';
  if (type==='message') return msgModal(ids);
  if (!confirm(`${type.toUpperCase()} ${scope}? Running sessions will be ended and billed.`)) return;
  act(()=>api('/bulk',{body:{type, ids}}), `${type} sent to ${scope}`);
});

// ---------- modals ----------
function modal(html){ $('#modal').innerHTML = html; $('#modalBg').classList.add('show'); const f=$('#modal input:not([type=hidden])'); f&&f.focus() }
function closeModal(){ $('#modalBg').classList.remove('show') }
$('#modalBg').onclick = e => { if (e.target.id==='modalBg') closeModal() };
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal() });
const pcById = id => state.pcs.find(p=>p.id===id);

function startModal(id){
  const p = pcById(id);
  modal(`<h3>Start session · ${esc(p.name)}</h3>
  <div class="row"><label>Type</label><div class="chips" id="modeChips">
    <span class="chip on" data-m="prepaid">Prepaid</span><span class="chip" data-m="postpaid">Pay later</span>
    <span class="chip" data-m="member">Member</span><span class="chip" data-m="free">Free / staff</span></div></div>
  <div id="mPre"><div class="row"><label>Minutes</label><div class="chips" id="minChips">
    ${[30,60,90,120,180,300].map(m=>`<span class="chip ${m===60?'on':''}" data-v="${m}">${m>=60?(m/60)+' hr':m+' min'}</span>`).join('')}</div>
    <input type="number" id="minutes" value="60" min="1" style="margin-top:6px"></div>
    <div class="row"><label>Payment</label><select id="method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select></div></div>
  <div id="mMem" class="hide"><div class="row"><label>Member username</label><input type="text" id="mUser"></div></div>
  <div class="row" id="mLabelRow"><label>Customer name (optional)</label><input type="text" id="label"></div>
  <div class="sub" id="price"></div>
  <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="go">Start</button></div>`);
  let mode='prepaid';
  const upd = () => { const m = +$('#minutes').value||0;
    $('#price').textContent = mode==='prepaid' ? `Collect ${money(p.rate*m/60)} now (${money(p.rate)}/hr)` :
      mode==='postpaid' ? `Billed at ${money(p.rate)}/hr when the session ends` : mode==='member' ? 'Deducted from member balance' : 'No charge' };
  $$('#modeChips .chip').forEach(c => c.onclick = () => { mode=c.dataset.m; $$('#modeChips .chip').forEach(x=>x.classList.toggle('on',x===c));
    $('#mPre').classList.toggle('hide', mode!=='prepaid'); $('#mMem').classList.toggle('hide', mode!=='member');
    $('#mLabelRow').classList.toggle('hide', mode==='member'); upd() });
  $$('#minChips .chip').forEach(c => c.onclick = () => { $('#minutes').value=c.dataset.v; $$('#minChips .chip').forEach(x=>x.classList.toggle('on',x===c)); upd() });
  $('#minutes').oninput = upd; upd();
  $('#go').onclick = async () => { const r = await act(()=>api(`/pc/${id}/start`, {body:{mode, minutes:+$('#minutes').value,
      username: $('#mUser').value, label: $('#label').value, method: $('#method').value}}), `Started on ${p.name}`); if (r) closeModal() };
}
function addTimeModal(id){
  const p = pcById(id);
  modal(`<h3>Add time · ${esc(p.name)}</h3>
  <div class="row"><label>Minutes</label><div class="chips">${[15,30,60,120].map(m=>`<span class="chip" onclick="$('#minutes').value=${m};$('#minutes').oninput()">+${m}</span>`).join('')}</div>
  <input type="number" id="minutes" value="30" min="1" style="margin-top:6px"></div>
  <div class="row"><label>Payment</label><select id="method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select></div>
  <div class="sub" id="price"></div>
  <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="go">Add</button></div>`);
  $('#minutes').oninput = () => $('#price').textContent = `Collect ${money(p.rate * (+$('#minutes').value||0) / 60)}`; $('#minutes').oninput();
  $('#go').onclick = async () => { const r = await act(()=>api(`/pc/${id}/addtime`, {body:{minutes:+$('#minutes').value, method:$('#method').value}}), 'Time added'); if (r) closeModal() };
}
async function endSession(id){
  const p = pcById(id);
  if (!confirm(`End session on ${p.name}?`)) return;
  const r = await act(()=>api(`/pc/${id}/end`, {body:{}}));
  if (r && r.bill) showBill(p.name, r.bill);
}
function showBill(name, b){
  modal(`<h3>Bill · ${esc(name)}</h3>
  <table><tbody>
   <tr><td>User</td><td>${esc(b.user)}</td></tr><tr><td>Type</td><td>${esc(b.mode)}</td></tr>
   <tr><td>Time used</td><td>${b.minutes_used} min${b.billed_minutes?` (billed ${b.billed_minutes})`:''}</td></tr>
   <tr><td>Amount</td><td>${money(b.amount)}</td></tr>
   ${b.balance_left!=null?`<tr><td>Balance left</td><td>${money(b.balance_left)}</td></tr>`:''}
   <tr><td><b>Collect now</b></td><td><b style="font-size:20px">${money(b.due)}</b></td></tr>
  </tbody></table>
  <div class="foot"><button class="btn pri" onclick="closeModal()">Done</button></div>`);
}
function msgModal(ids){
  const scope = ids ? (ids.length===1 ? pcById(ids[0]).name : `${ids.length} PCs`) : 'all online PCs';
  modal(`<h3>Message to ${esc(scope)}</h3>
  <div class="row"><input type="text" id="msg" maxlength="500" placeholder="e.g. Cafe closes in 15 minutes"></div>
  <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="go">Send</button></div>`);
  const send = async () => { const text=$('#msg').value; const r = await act(()=> ids && ids.length===1 ?
      api(`/pc/${ids[0]}/command`, {body:{type:'message', text}}) : api('/bulk', {body:{type:'message', text, ids}}), 'Message sent'); if (r) closeModal() };
  $('#go').onclick = send; $('#msg').onkeydown = e => { if (e.key==='Enter') send() };
}
function pcModal(id){
  const p = pcById(id);
  const groups = Object.keys(state.settings.rates).map(g=>`<option ${g===p.group?'selected':''}>${esc(g)}</option>`).join('');
  modal(`<h3>${esc(p.name)}</h3>
  <div class="row"><label>Display name</label><input type="text" id="pName" value="${esc(p.name)}"></div>
  <div class="row"><label>Rate group</label><select id="pGrp">${groups}</select></div>
  <div class="sub">ID ${esc(p.id)} · ${esc(p.ip)} · ${esc(p.info.os||'')} ${p.info.user?'· Windows user '+esc(p.info.user):''}</div>
  <div class="acts" style="margin-top:12px">
    <button class="btn" onclick="cmd('${id}','lock')">Lock</button>
    <button class="btn" onclick="cmd('${id}','logoff')">Log off</button>
    <button class="btn danger" onclick="cmd('${id}','restart')">Restart</button>
    <button class="btn danger" onclick="cmd('${id}','shutdown')">Shut down</button>
    <button class="btn danger" onclick="delPc('${id}')">Remove</button>
  </div>
  <div class="foot"><button class="btn" onclick="closeModal()">Close</button><button class="btn pri" id="go">Save</button></div>`);
  $('#go').onclick = async () => { const r = await act(()=>api(`/pc/${id}/update`, {body:{name:$('#pName').value, group:$('#pGrp').value}}), 'Saved'); if (r) closeModal() };
}
async function cmd(id, type){
  if (type!=='lock' && !confirm(`${type} ${pcById(id).name}?`)) return;
  const r = await act(()=>api(`/pc/${id}/command`, {body:{type}}), `${type} sent`);
  if (r){ closeModal(); if (r.bill) showBill(pcById(id)?.name||id, r.bill) }
}
async function delPc(id){ if (confirm('Remove this PC from the list? It will re-appear if its agent connects again.')) { await act(()=>api(`/pc/${id}`,{method:'DELETE'}), 'Removed'); closeModal() } }

// ---------- members ----------
let mTimer;
$('#mSearch').oninput = () => { clearTimeout(mTimer); mTimer=setTimeout(loadMembers, 250) };
async function loadMembers(){
  try { const rows = await api('/members?q='+encodeURIComponent($('#mSearch').value));
    $('#mBody').innerHTML = rows.length ? rows.map(m=>`<tr><td><b>${esc(m.username)}</b></td><td>${esc(m.full_name)}</td><td>${esc(m.phone)}</td>
      <td>${money(m.balance)}</td><td>${m.on_pc?'Playing on '+esc(m.on_pc):'<span class="muted">—</span>'}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm pri" onclick="topupModal(${m.id},'${esc(m.username)}')">Top up</button>
      <button class="btn sm" onclick="pwModal(${m.id})">Password</button>
      <button class="btn sm danger" onclick="delMember(${m.id},'${esc(m.username)}')">Delete</button></td></tr>`).join('')
      : `<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">No members yet</td></tr>`;
  } catch(e){ toast(e.message, true) }
}
$('#mAdd').onclick = () => {
  modal(`<h3>New member</h3>
  <div class="row"><label>Username (used to log in at the PC)</label><input type="text" id="u"></div>
  <div class="row"><label>Password</label><input type="password" id="p"></div>
  <div class="row"><label>Full name</label><input type="text" id="n"></div>
  <div class="row"><label>Phone</label><input type="text" id="ph"></div>
  <div class="row"><label>Opening balance (${esc(cur())})</label><input type="number" id="b" value="0" min="0"></div>
  <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="go">Create</button></div>`);
  $('#go').onclick = async () => { const r = await act(()=>api('/members', {body:{username:$('#u').value, password:$('#p').value,
     full_name:$('#n').value, phone:$('#ph').value, balance:+$('#b').value}}), 'Member created'); if (r){ closeModal(); loadMembers() } };
};
function topupModal(id, name){
  modal(`<h3>Top up · ${name}</h3>
  <div class="row"><label>Amount (${esc(cur())}) — use a negative value for a refund</label>
   <div class="chips">${[100,200,500,1000].map(a=>`<span class="chip" onclick="$('#amt').value=${a}">${money(a)}</span>`).join('')}</div>
   <input type="number" id="amt" value="200" style="margin-top:6px"></div>
  <div class="row"><label>Payment</label><select id="method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select></div>
  <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="go">Top up</button></div>`);
  $('#go').onclick = async () => { const r = await act(()=>api(`/members/${id}/topup`, {body:{amount:+$('#amt').value, method:$('#method').value}}), 'Balance updated'); if (r){ closeModal(); loadMembers() } };
}
function pwModal(id){
  modal(`<h3>Reset password</h3><div class="row"><input type="password" id="p" placeholder="New password"></div>
  <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="go">Save</button></div>`);
  $('#go').onclick = async () => { const r = await act(()=>api(`/members/${id}/password`, {body:{password:$('#p').value}}), 'Password changed'); if (r) closeModal() };
}
async function delMember(id, name){ if (confirm(`Delete member ${name}? Their balance will be lost.`)) { await act(()=>api(`/members/${id}`,{method:'DELETE'}), 'Deleted'); loadMembers() } }

// ---------- reports ----------
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10) };
$('#rDate').value = todayISO();
$('#rLoad').onclick = loadReport; $('#rDate').onchange = loadReport;
$('#rCsv').onclick = async () => {
  const r = await fetch('/api/report.csv?date='+$('#rDate').value, {headers:{'X-Admin-Token':token}});
  if (!r.ok) return toast('Download failed', true);
  const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = `cafe-report-${$('#rDate').value}.csv`; a.click();
};
async function loadReport(){
  try { const r = await api('/report?date='+$('#rDate').value), t = r.totals;
    $('#rCards').innerHTML = [['Cash collected', money(t.cash_collected)], ['Walk-in sales', money(t.walkin_sales)],
      ['Member top-ups', money(t.member_topups)], ['Member usage', money(t.member_usage)],
      ['Sessions', t.sessions], ['Hours played', t.hours_played]].map(([k,v])=>`<div class="card"><small>${k}</small><b>${v}</b></div>`).join('');
    const reason = {staff:'Staff', time_up:'Time up', user_logout:'User', locked_by_staff:'Staff lock', shutdown:'Shutdown', restart:'Restart', logoff:'Log off'};
    $('#rBody').innerHTML = r.sessions.length ? r.sessions.map(s=>`<tr><td>${fmtTime(s.started)}</td><td>${s.ended?fmtTime(s.ended):'<i>running</i>'}</td>
      <td>${esc(s.pc_name)}</td><td>${esc(s.user_label)}</td><td>${esc(s.mode)}</td><td>${s.minutes!=null?Math.round(s.minutes):''}</td>
      <td>${money(s.ended ? s.amount : s.prepaid)}</td><td>${esc(reason[s.end_reason]||s.end_reason||'')}</td></tr>`).join('')
      : `<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">No sessions on this day</td></tr>`;
  } catch(e){ toast(e.message, true) }
}

// ---------- settings ----------
function rateRow(g='', v=''){ const d=document.createElement('div'); d.className='bar'; d.style.marginBottom='6px';
  d.innerHTML=`<input type="text" class="rg" value="${esc(g)}" placeholder="Group" style="flex:1"><input type="number" class="rv" value="${esc(v)}" min="0" style="width:110px">
  <button class="btn sm danger" type="button">✕</button>`; d.querySelector('button').onclick=()=>d.remove(); $('#sRates').appendChild(d) }
$('#sAddRate').onclick = () => rateRow();
async function loadSettings(){
  try { const s = await api('/settings');
    $('#sName').value=s.cafe_name; $('#sCur').value=s.currency; $('#sMin').value=s.min_minutes; $('#sRound').value=s.round_to_minutes;
    $('#sKey').textContent=s.agent_key; $('#sPw').value=''; $('#sRates').innerHTML=''; Object.entries(s.rates).forEach(([g,v])=>rateRow(g,v));
  } catch(e){ toast(e.message, true) }
}
$('#sSave').onclick = () => { const rates={}; $$('#sRates .bar').forEach(r=>{ const g=r.querySelector('.rg').value.trim(); if(g) rates[g]=+r.querySelector('.rv').value });
  const body={cafe_name:$('#sName').value, currency:$('#sCur').value, rates, min_minutes:+$('#sMin').value, round_to_minutes:+$('#sRound').value};
  if ($('#sPw').value) body.admin_password=$('#sPw').value;
  act(()=>api('/settings',{body}), 'Settings saved').then(loadSettings) };

// ---------- loop ----------
setInterval(refresh, 2000);
setInterval(() => { if (state && !$('#tab-pcs').classList.contains('hide')) render() }, 1000);
if (token) boot();
</script>
</body>
</html>
